<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>CyberFit — Baseline Assessment</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #f0f4f8; margin: 0; padding: 2rem 1rem; color: #222; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #1a237e; margin-top: 0; }
        .q-block { margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid #eee; }
        .q-block h3 { margin: 0 0 1rem; font-size: 1.05rem; color: #333; }
        .option { display: block; margin-bottom: 0.5rem; cursor: pointer; font-size: 0.95rem; }
        .option input { margin-right: 0.5rem; }
        .btn { background: #1a237e; color: white; border: none; padding: 1rem; width: 100%; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>👋 Welcome to CyberFit!</h1>
            <p style="color: #555; margin-bottom: 2rem;">To give you the best learning experience, take this quick 4-question assessment. We'll tailor the guides to your knowledge level.</p>
            
            <form id="survey-form">
                <div class="q-block">
                    <h3>{{ t.survey_q1 }}</h3>
                    <label class="option"><input type="radio" name="q1" value="0" required> {{ t.survey_q1_a }}</label>
                    <label class="option"><input type="radio" name="q1" value="1"> {{ t.survey_q1_b }}</label>
                    <label class="option"><input type="radio" name="q1" value="1"> {{ t.survey_q1_c }}</label>
                </div>
                
                <!-- Do the same for Q2, Q3, Q4... -->
                
                <button type="submit" class="btn">{{ t.survey_btn }}</button>
            </form>

                
        </div>
    </div>

    <script>
        const token = localStorage.getItem('cyberfit_token');
        
        document.getElementById('survey-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Calculate score (Max 4 points)
            const formData = new FormData(e.target);
            let score = 0;
            for (let [key, value] of formData.entries()) {
                score += parseInt(value);
            }
            
            // Determine tier
            let level = 'beginner';
            if (score >= 3) level = 'intermediate';
            if (score === 4) level = 'advanced';

            // Send to backend
            const res = await fetch('/api/survey/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ level: level })
            });

            if (res.ok) {
                window.location.href = '/learning';
            } else {
                alert('Error saving survey. Please try again.');
            }
        });
    </script>
</body>
</html>
