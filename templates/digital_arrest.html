<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>CyberFit — Digital Arrest Simulation</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #1a1a1a; color: #eee; margin: 0; padding: 2rem 1rem; display: flex; justify-content: center; min-height: 100vh; }
        .phone { background: #000; width: 100%; max-width: 450px; border-radius: 30px; border: 8px solid #333; box-shadow: 0 10px 40px rgba(0,0,0,0.8); overflow: hidden; display: flex; flex-direction: column; min-height: 600px; }
        
        .call-header { background: #1a237e; padding: 1.5rem; text-align: center; border-bottom: 1px solid #333; }
        .call-header h2 { margin: 0; font-size: 1.2rem; color: #fff; }
        .call-header p { margin: 0.25rem 0 0; font-size: 0.85rem; color: #aaa; }
        .pulse { display: inline-block; width: 10px; height: 10px; background: #f44336; border-radius: 50%; margin-right: 6px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(244, 67, 54, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(244, 67, 54, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(244, 67, 54, 0); } }

        .chat-area { padding: 1.5rem; flex: 1; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; }
        .speaker { font-size: 0.8rem; color: #888; margin-bottom: 0.25rem; }
        .bubble { background: #333; padding: 1rem; border-radius: 0 15px 15px 15px; font-size: 0.95rem; line-height: 1.5; color: #fff; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .choices { padding: 1rem 1.5rem 2rem; display: flex; flex-direction: column; gap: 0.75rem; }
        .choice-btn { background: #222; border: 1px solid #444; color: #eee; padding: 1rem; border-radius: 10px; font-size: 0.9rem; text-align: left; cursor: pointer; transition: all 0.2s; }
        .choice-btn:hover { background: #1a237e; border-color: #3949ab; }

        .feedback-area { padding: 1.5rem; background: #222; border-radius: 12px; margin-top: 1rem; border-left: 4px solid #ff9800; }
        .feedback-text { font-size: 0.95rem; line-height: 1.5; margin-bottom: 1rem; }
        .continue-btn { background: #3949ab; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem; }
        
        .stop-card { background: linear-gradient(135deg, #c62828, #b71c1c); padding: 2rem; border-radius: 15px; text-align: center; color: white; margin-top: 1rem; animation: slideIn 0.5s; }
        .stop-card h3 { margin-top: 0; font-size: 1.5rem; letter-spacing: 2px; }
        .stop-card ol { text-align: left; font-size: 1.1rem; line-height: 1.8; margin: 1rem 0; padding-left: 1.5rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="phone" id="app">
        <div style="padding: 3rem; text-align: center; color: #888;">Connecting to secure line...</div>
    </div>

    <script>
        const TOKEN_KEY = 'cyberfit_token';
        const token = localStorage.getItem(TOKEN_KEY);

        let scenario = null;
        let currentStepIndex = 0;
        let score = 0;
        const app = document.getElementById('app');

        async function init() {
            if (!token) {
                app.innerHTML = '<div style="padding: 2rem; text-align: center;">Please <a href="/test" style="color:#64b5f6;">login</a> first.</div>';
                return;
            }
            try {
                const res = await fetch('/api/digital-arrest/scenario', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                scenario = data;
                renderStep();
            } catch (e) {
                app.innerHTML = '<div style="padding: 2rem;">Network error.</div>';
            }
        }

        function renderStep() {
            if (currentStepIndex >= scenario.steps.length) {
                finishScenario();
                return;
            }

            const step = scenario.steps[currentStepIndex];
            
            let html = `
                <div class="call-header">
                    <h2><span class="pulse"></span>${scenario.caller_name}</h2>
                    <p>${scenario.title}</p>
                </div>
                <div class="chat-area">
                    <div class="speaker">Officer Sharma</div>
                    <div class="bubble">${step.text}</div>
                </div>
                <div class="choices" id="choices-container">
            `;

            step.choices.forEach((choice, idx) => {
                html += `<button class="choice-btn" onclick="makeChoice(${idx})">${choice.text}</button>`;
            });

            html += `</div>`;
            app.innerHTML = html;
        }

        function makeChoice(choiceIdx) {
            const step = scenario.steps[currentStepIndex];
            const choice = step.choices[choiceIdx];
            
            if (choice.is_correct) score += 25; // 4 steps, 25 points each = 100 max

            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = `
                <div class="feedback-area">
                    <div class="feedback-text">${choice.feedback}</div>
                    <button class="continue-btn" onclick="nextStep()">Continue</button>
                </div>
            `;
        }

        function nextStep() {
            currentStepIndex++;
            renderStep();
        }

        async function finishScenario() {
            const finalScore = Math.min(100, Math.max(0, score));
            
            app.innerHTML = `
                <div class="call-header" style="background:#2e7d32;">
                    <h2>Call Disconnected</h2>
                    <p>You survived the simulation</p>
                </div>
                <div class="chat-area">
                    <div class="stop-card">
                        <h3>THE STOP PROTOCOL</h3>
                        <p>If this happens in real life, remember:</p>
                        <ol>
                            <li><strong>Stop</strong> talking.</li>
                            <li><strong>Take</strong> a breath.</li>
                            <li><strong>Never</strong> share OTP or money.</li>
                            <li><strong>Call</strong> a family member.</li>
                            <li><strong>Report</strong> to 1930.</li>
                        </ol>
                    </div>
                    <div style="text-align:center; margin-top:1.5rem;">
                        <p style="color:#aaa;">Score: <strong>${finalScore}/100</strong></p>
                        <a href="/" style="color:#64b5f6;">Back to Dashboard</a>
                    </div>
                </div>
            `;

            // Save to DB
            try {
                await fetch('/api/digital-arrest/submit', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ score: finalScore })
                });
            } catch (e) { console.error('Save failed', e); }
        }

        init();
    </script>
</body>
</html>
